<header>
    <button (click)="navigateToAddTransaction()" aria-label="Adicionar Transação">
        <mat-icon fontIcon="add"></mat-icon>
    </button>
    <p>Olá {{ user_name }}</p>
    <div class="buttons">
        <button (click)="toggleTheme()" aria-label="Alternar Tema">
            <mat-icon [fontIcon]="themeIcon()"></mat-icon>
        </button>
        <button (click)="logout()" aria-label="Sair">
            <mat-icon fontIcon="logout"></mat-icon>
        </button>
    </div>
</header>

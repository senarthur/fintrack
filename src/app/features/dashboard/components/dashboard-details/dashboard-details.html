<app-header></app-header>
@if (transaction(); as t) {
<section class="container">
    <div class="container-title">
        <mat-icon fontIcon="arrow_back" (click)="goBack()"></mat-icon>
        <h2>Detalhe</h2>
    </div>
    <div class="amount-overview">
        <h2>Valor Atual</h2>
        <span [hidden]="!amountDisabled()">{{ t.amount | currency: 'BRL' }}</span>
        <div class="edit-amount">
            <span [hidden]="amountDisabled()">R$ </span>
            <input #amountInput type="number" [disabled]="amountDisabled()" [value]="t.amount"
                [hidden]="amountDisabled()" />
        </div>
        <button (click)="editAmount(amountInput.value)">{{ amountButton() }}</button>
    </div>

    <div class="details">
        <div class="card">
            <div class="icon">
                <p>{{ t.title.charAt(0) }}</p>
            </div>
            <div class="title">
                <input #titleInput type="text" [value]="t.title" [disabled]="titleDisabled()" />
                <textarea #descriptionInput 
                    matInput
                    cdkTextareaAutosize
                    cdkAutosizeMinRows="1"
                    sdkAutosizeMaxRows="5"
                    [disabled]="descriptionDisabled()" 
                    class="description"
                    [value]="t.description">
                </textarea>
            </div>
        </div>

        <div class="buttons">
            <app-button variant="primary" (onClick)="toggleTitleEdit(titleInput.value)">{{ textTitleButton() }}</app-button>
            <app-button variant="primary" (onClick)="toggleDescriptionEdit(descriptionInput.value)">{{ descriptionButton() }}</app-button>
            <app-button variant="primary" (onClick)="deleteTransaction()">Deletar</app-button>
        </div>
        <p>Transação criada em: {{ t.createdAt | date: 'dd/MM/yyyy' }}</p>
    </div>
</section>
} @else {
    <app-loading-spinner></app-loading-spinner>
}
